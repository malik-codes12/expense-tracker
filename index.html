<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Personal Expense Tracker</h1>
        <p class="subtitle">Manage your daily money easily</p>

        <!-- Balance Section -->
        <div class="balance-card">
            <h3>Total Available Balance</h3>
            <h1 id="balance">₹0</h1>
        </div>

        <!-- Income and Expense -->
        <div class="summary">

            <div class="box income-box">
                <h3>Total Income</h3>
                <h2 id="income">₹0</h2>
            </div>

            <div class="box expense-box">
                <h3>Total Expense</h3>
                <h2 id="expense">₹0</h2>
            </div>

        </div>

        <!-- Add Transaction Form -->
        <div class="form-section">

            <h2>Add New Transaction</h2>

            <form id="transaction-form">

                <input
                    type="text"
                    id="description"
                    placeholder="Enter description"
                >

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    min="0.01"
                    step="0.01"
                >

                <select id="type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <button type="submit">Add Transaction</button>

            </form>

        </div>

        <!-- Transaction List -->
        <div class="transaction-section">

            <h2>Transaction History</h2>

            <ul id="transaction-list">
            </ul>

        </div><!-- Beautiful Flower Animation -->

<div class="flower-section">

    <h2>Keep Growing! 🌸</h2>
    <p>Small steps make beautiful changes.</p>

    <div class="flower">

        <!-- Flower Petals -->
        <div class="petals">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Flower Center -->
        <div class="flower-center"></div>

        <!-- Stem -->
        <div class="stem"></div>

        <!-- Leaves -->
        <div class="leaf leaf-left"></div>
        <div class="leaf leaf-right"></div>

    </div>

</div>

    </div>

    <script src="script.js"></script>

</body>
</html>
